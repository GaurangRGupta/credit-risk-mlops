<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credit Risk Predictor</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6fb; margin: 0; }
    .card { max-width: 820px; margin: 30px auto; background: #fff; padding: 24px 28px;
            border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { margin: 0 0 4px; font-size: 24px; }
    p.sub { color: #666; margin: 0 0 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
    label { font-size: 13px; color: #333; display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 7px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { margin-top: 18px; padding: 10px 22px; border: 0; border-radius: 8px;
             background: #2b59c3; color: #fff; font-size: 15px; cursor: pointer; }
    #result { margin-top: 18px; padding: 14px; border-radius: 8px; display: none; font-size: 17px; }
    .good { background: #e5f6ea; color: #1d6b34; }
    .bad { background: #fde8e8; color: #9b1c1c; }
  </style>
</head>
<body>
<div class="card">
  <h1>Credit Risk Predictor</h1>
  <p class="sub">German Credit (OpenML credit-g) model, served with Flask</p>
  <form id="form">
    <div class="grid">
      {% for f in num_fields %}
      <div><label>{{ f.replace('_', ' ') }}</label>
        <input type="number" step="any" name="{{ f }}" required></div>
      {% endfor %}
      {% for f, opts in cat_options.items() %}
      <div><label>{{ f.replace('_', ' ') }}</label>
        <select name="{{ f }}">{% for o in opts %}<option>{{ o }}</option>{% endfor %}</select></div>
      {% endfor %}
    </div>
    <button type="submit">Predict</button>
  </form>
  <div id="result"></div>
</div>
<script>
  const defaults = {duration: 12, credit_amount: 2500, installment_commitment: 3,
                    residence_since: 2, age: 35, existing_credits: 1, num_dependents: 1};
  for (const [k, v] of Object.entries(defaults)) {
    const el = document.querySelector(`[name="${k}"]`); if (el) el.value = v;
  }
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = {};
    new FormData(e.target).forEach((v, k) => {
      data[k] = e.target.elements[k].type === "number" ? Number(v) : v;
    });
    const res = await fetch("/predict", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify(data)});
    const body = await res.json();
    const box = document.getElementById("result");
    box.style.display = "block";
    if (!res.ok) { box.className = "bad"; box.textContent = "Error: " + JSON.stringify(body); return; }
    box.className = body.risk;
    box.textContent = `Risk: ${body.risk.toUpperCase()} (probability of bad credit: ${(body.probability_bad * 100).toFixed(1)}%)`;
  });
</script>
</body>
</html>
